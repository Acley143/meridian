openapi: 3.0.3
info:
  title: Meridian Core Service API
  version: "0.1.0"
  description: >
    REST + Server-Sent Events surface exposed by services/core-service
    (ADR-0009). Request/response operations are plain REST; the live risk
    stream is SSE. Types below are a mechanical translation of
    docs/domain-model.md.


    **Money is a JSON string, never a JSON number.** Every decimal field
    below (precision 38, scale 8 per ADR-0004/ADR-0013) is typed `string` in
    this spec, deliberately. IEEE-754 doubles cannot represent a scale-8
    decimal exactly, and a JavaScript client parsing a JSON number will
    silently coerce it to the nearest representable double, corrupting the
    value with no error raised anywhere. Every client must parse these
    fields with a decimal library (e.g. `decimal.js` in TypeScript), never
    with `Number()` or `JSON.parse`'s default numeric coercion.
servers:
  - url: http://localhost:8080

paths:
  /api/v1/portfolios:
    post:
      summary: Create a portfolio.
      description: >
        Creates a portfolio row, appends a `portfolio_created` audit entry,
        and publishes a `portfolio.state` record with an empty `positions`
        array, all in one transaction (ADR-0024).


        **Not idempotency-key based, unlike `POST /trades` (ADR-0024).**
        `portfolio_id` is client-supplied and is itself the resource's
        identity; a portfolio is fully specified by its own fields, so a
        retry is detected by comparing the persisted row, not a raw request
        fingerprint. A retry with the same `portfolio_id` and the same
        `name`/`base_currency`/`owner` returns `200` with the stored
        portfolio (no second audit entry, no second `portfolio.state`
        message); the same `portfolio_id` with any of those three fields
        different returns `409`.
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "201":
          description: Portfolio created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "200":
          description: >
            `portfolio_id` already existed with `name`, `base_currency`, and
            `owner` all matching this request -- the stored portfolio,
            unchanged. Not re-created; no new audit entry or
            `portfolio.state` message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          description: >
            A required field was missing or blank, or `base_currency` did
            not match `^[A-Z]{3}$`.
        "409":
          description: >
            `portfolio_id` already existed with a different `name`,
            `base_currency`, or `owner`. Not applied.

  /api/v1/portfolios/{portfolioId}:
    get:
      summary: Fetch a portfolio's metadata.
      operationId: getPortfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: No portfolio with that id.

  /api/v1/portfolios/{portfolioId}/positions:
    get:
      summary: Fetch the current positions for a portfolio.
      operationId: listPositions
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /api/v1/portfolios/{portfolioId}/risk:
    get:
      summary: Fetch the latest risk snapshot for a portfolio, under the latest pricer_version.
      operationId: getLatestRisk
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"
        "404":
          description: No snapshot exists yet for that portfolio.

  /api/v1/portfolios/{portfolioId}/risk/history:
    get:
      summary: Bounded range query over a portfolio's risk snapshot history.
      description: >
        Returns snapshots with `as_of` in `[from, to]`, most recent first,
        capped at `limit`. This is a REST alternative to
        `/api/v1/.../risk/stream` for a client that wants a fixed window of history
        rather than a live feed -- e.g. to render a chart on page load
        before subscribing to the stream for updates.
      operationId: getRiskHistory
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - name: from
          in: query
          required: true
          description: Inclusive lower bound on `as_of`, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Inclusive upper bound on `as_of`, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum snapshots returned. Same bound as SSE replay (ADR-0012).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskSnapshot"
        "400":
          description: "`from` is after `to`, or the range exceeds what the service is willing to scan in one request."

  /api/v1/portfolios/{portfolioId}/risk/stream:
    get:
      summary: Server-Sent Events stream of RiskSnapshot updates for a portfolio.
      description: >
        Resume semantics per ADR-0012. Each event's `id:` field is
        `{portfolio_id}:{as_of_micros}:{pricer_version}` -- the ADR-0007
        identity tuple. On reconnect the browser's EventSource automatically
        sends `Last-Event-ID` with the id of the last event it received; the
        service parses it and replays persisted snapshots for this portfolio
        with a later `as_of` than the one in the header. Replay is bounded at
        500 snapshots or 15 minutes, whichever is smaller -- beyond that
        bound the service emits a `resync` event instead of replaying, and
        the client must refetch full state via `GET /api/v1/portfolios/{id}/positions`
        and `GET /api/v1/portfolios/{id}/risk`.
      operationId: streamRisk
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            Sent automatically by EventSource on reconnect. Format
            `{portfolio_id}:{as_of_micros}:{pricer_version}`, per ADR-0012.
          schema:
            type: string
      responses:
        "200":
          description: >
            text/event-stream of two event types. The default (unnamed)
            event carries a RiskSnapshot JSON payload per `data:` line, with
            an `id:` line per ADR-0012. An `event: resync` carries no
            RiskSnapshot payload and signals the client to refetch full
            state via REST because the requested replay exceeded the bound
            in ADR-0012.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"

  /api/v1/trades:
    post:
      summary: Book a trade.
      description: >
        Synchronous REST booking endpoint (Q1 default; see
        services/core-service/PLAN.md open questions for whether this stays
        REST or moves to an inbound Kafka topic). Updates the affected
        portfolio's positions and produces a PortfolioState message
        (ADR-0003).


        **Idempotent (ADR-0023).** `Idempotency-Key` is required. A retry
        with the same key and the same request body replays the original
        `201` (or `400`) response verbatim, including the original
        `trade_id` -- it does not book a second trade. The same key with a
        *different* request body is rejected with `409` and never
        replayed. A key is scoped to this endpoint only; reusing it against
        a different endpoint is not a collision.
      operationId: bookTrade
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "201":
          description: Trade booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: >
            Malformed trade (e.g. non-positive contract_size on the
            referenced instrument, unknown portfolio_id/instrument_id), or
            a missing/empty `Idempotency-Key` header.
        "409":
          description: >
            `Idempotency-Key` was already used with a request body that
            does not match this one (ADR-0023). The original trade was not
            re-booked and this request was not applied.

  /api/v1/instruments:
    post:
      summary: Create an instrument.
      description: >
        Creates an instrument row, appends an `instrument_created` audit
        entry (with a null `portfolio_id` -- ADR-0025), and publishes a
        `reference.instruments` record, all in one transaction (ADR-0025).


        **Not idempotency-key based, for the same reason as `POST
        /portfolios` (ADR-0024, cited by ADR-0025).** `instrument_id` is
        client-supplied and is itself the resource's identity; an
        instrument is fully specified by its own fields, so a retry is
        detected by comparing the persisted row, not a raw request
        fingerprint. A retry with the same `instrument_id` and every other
        field matching returns `200` with the stored instrument (no second
        audit entry, no second `reference.instruments` message); the same
        `instrument_id` with any field different returns `409`.


        **Conditional fields.** `option_type`, `strike`, and `expiry` must
        all be present when `instrument_type` is `VANILLA_EUROPEAN_OPTION`
        or `VANILLA_AMERICAN_OPTION`, and all absent otherwise --
        present-and-non-null on a non-option is rejected with `400`, not
        silently ignored.
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentRequest"
      responses:
        "201":
          description: Instrument created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "200":
          description: >
            `instrument_id` already existed with every other field matching
            this request -- the stored instrument, unchanged. Not
            re-created; no new audit entry or `reference.instruments`
            message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "400":
          description: >
            A required field was missing, `instrument_type`/`option_type`
            did not parse into the generated Avro enum, a conditional-field
            rule was violated in either direction, `currency` did not match
            `^[A-Z]{3}$`, `contract_size` was not strictly positive, or
            `strike`/`expiry` was unparseable.
        "409":
          description: >
            `instrument_id` already existed with at least one field
            different. Not applied.

  /api/v1/portfolios/{portfolioId}/audit:
    get:
      summary: Fetch audit log entries for a portfolio.
      description: >
        Contract defined in Q1; the hash-chained audit log itself (ADR-0008)
        is a Q2 deliverable in services/core-service/PLAN.md. This endpoint
        may 501 until then.
      operationId: getAudit
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: OK, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "501":
          description: Audit log not yet implemented (Q1).

components:
  parameters:
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-supplied opaque token identifying one logical write attempt
        (ADR-0023). Must not be empty. Natural-key dedup on the request
        body is deliberately not used -- two genuine trades can share every
        other field at the same instant, so only a client-chosen key tells
        a retry apart from a second submission.
      schema:
        type: string
        minLength: 1

  schemas:
    Portfolio:
      type: object
      description: See docs/domain-model.md#portfolio.
      required: [portfolio_id, name, base_currency, owner]
      properties:
        portfolio_id:
          type: string
        name:
          type: string
        base_currency:
          type: string
          description: ISO 4217 currency code.
        owner:
          type: string

    PortfolioRequest:
      type: object
      description: >
        Body of POST /api/v1/portfolios (ADR-0024). Same fields as Portfolio
        -- creation takes the full resource up front, since portfolio_id is
        client-supplied and there is no server-assigned identity to return
        separately.
      required: [portfolio_id, name, base_currency, owner]
      properties:
        portfolio_id:
          type: string
        name:
          type: string
        base_currency:
          type: string
          description: ISO 4217 currency code. Validated against ^[A-Z]{3}$ only -- not checked against the ISO 4217 table itself.
          pattern: "^[A-Z]{3}$"
        owner:
          type: string

    Instrument:
      type: object
      description: >
        See docs/domain-model.md#instrument and
        contracts/avro/reference-instruments.avsc -- field-for-field the
        same shape published to reference.instruments. option_type,
        strike, and expiry are always present in the response, null unless
        instrument_type is VANILLA_EUROPEAN_OPTION or
        VANILLA_AMERICAN_OPTION.
      required:
        [
          instrument_id,
          underlying_id,
          instrument_type,
          option_type,
          strike,
          expiry,
          currency,
          contract_size,
        ]
      properties:
        instrument_id:
          type: string
        underlying_id:
          type: string
        instrument_type:
          type: string
          enum: [EQUITY, VANILLA_EUROPEAN_OPTION, VANILLA_AMERICAN_OPTION]
        option_type:
          type: string
          enum: [CALL, PUT]
          nullable: true
        strike:
          type: string
          nullable: true
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.
        expiry:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
          description: ISO 4217 currency code.
        contract_size:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.

    InstrumentRequest:
      type: object
      description: >
        Body of POST /api/v1/instruments (ADR-0025). Same fields as
        Instrument -- creation takes the full resource up front, since
        instrument_id is client-supplied and there is no server-assigned
        identity to return separately. option_type, strike, and expiry are
        required together when instrument_type is
        VANILLA_EUROPEAN_OPTION or VANILLA_AMERICAN_OPTION, and must all be
        absent otherwise.
      required: [instrument_id, underlying_id, instrument_type, currency, contract_size]
      properties:
        instrument_id:
          type: string
        underlying_id:
          type: string
        instrument_type:
          type: string
          enum: [EQUITY, VANILLA_EUROPEAN_OPTION, VANILLA_AMERICAN_OPTION]
        option_type:
          type: string
          enum: [CALL, PUT]
          nullable: true
        strike:
          type: string
          nullable: true
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Required iff instrument_type is an option type.
        expiry:
          type: string
          format: date-time
          nullable: true
          description: Required iff instrument_type is an option type.
        currency:
          type: string
          description: ISO 4217 currency code. Validated against ^[A-Z]{3}$ only -- not checked against the ISO 4217 table itself.
          pattern: "^[A-Z]{3}$"
        contract_size:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Must be strictly positive.

    Position:
      type: object
      description: See docs/domain-model.md#position.
      required: [portfolio_id, instrument_id, quantity, average_cost, as_of_event_time]
      properties:
        portfolio_id:
          type: string
        instrument_id:
          type: string
        quantity:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Signed -- positive is long.
        average_cost:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.
        as_of_event_time:
          type: string
          format: date-time
          description: UTC, microsecond precision.

    RiskSnapshot:
      type: object
      description: See docs/domain-model.md#risksnapshot, ADR-0007, and contracts/avro/risk-snapshot.avsc (this is the same shape as the wire schema).
      required: [portfolio_id, base_currency, as_of, pricer_version, price, cash_delta, cash_gamma, cash_vega, cash_theta, cash_rho, var_95, scenario_id, oldest_input_event_time, ingest_time]
      properties:
        portfolio_id:
          type: string
        base_currency:
          type: string
          description: The reporting currency (ISO 4217) these figures are denominated in, copied from the portfolio's base_currency (ADR-0028). An empty string means unknown and is never written by services/pricer.
        as_of:
          type: string
          format: date-time
          description: Part of the ADR-0007 identity tuple. Distinct from ingest_time.
        pricer_version:
          type: string
        price:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Portfolio-level mark-to-market value.
        cash_delta:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Cash delta (ADR-0017) -- currency change per 1% relative move in spot, summed across positions. Not the per-unit float64 delta docs/conventions.md defines for quant_core; raw per-unit Greeks aren't summable across a portfolio's different underlyings.
        cash_gamma:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Cash gamma (ADR-0017) -- change in cash_delta per 1% move in spot, summed across positions.
        cash_vega:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Cash vega (ADR-0017) -- currency per 1.00 absolute change in volatility, not per 1% (docs/conventions.md), summed across positions.
        cash_theta:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Cash theta (ADR-0017) -- currency per calendar year, not per day (docs/conventions.md), summed across positions.
        cash_rho:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Cash rho (ADR-0017) -- currency per 1.00 absolute change in rate (docs/conventions.md), summed across positions.
        var_95:
          type: number
          format: double
        scenario_id:
          type: string
          description: Propagated from the Tick stream that produced this snapshot (ADR-0011), for end-to-end lineage.
        oldest_input_event_time:
          type: string
          format: date-time
          description: >
            UTC, microsecond precision. The earliest event_time among the
            prices actually used to price this snapshot's positions -- see
            docs/domain-model.md#risksnapshot. Equal to as_of when every
            input was priced off the triggering tick itself; earlier than
            as_of means at least one position's price is resting on a tick
            that hasn't updated since, i.e. this snapshot is live but
            stale-but-not-wrong. The epoch value (1970-01-01T00:00:00Z) is a
            sentinel meaning "unknown, produced by a pricer that predates
            this field" -- not a real staleness value -- per the Avro
            schema's BACKWARD-compatible default.
        ingest_time:
          type: string
          format: date-time

    TradeRequest:
      type: object
      description: Body of POST /api/v1/trades. See docs/domain-model.md#trade -- trade_id and ingest_time are server-assigned, not client-supplied.
      required: [portfolio_id, instrument_id, quantity, price, event_time]
      properties:
        portfolio_id:
          type: string
        instrument_id:
          type: string
        quantity:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Signed -- positive is a buy, negative is a sell.
        price:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Execution price per unit, not adjusted for fees.
        event_time:
          type: string
          format: date-time
          description: UTC instant the trade executed upstream.

    Trade:
      type: object
      description: See docs/domain-model.md#trade.
      required: [trade_id, portfolio_id, instrument_id, quantity, price, event_time, ingest_time]
      properties:
        trade_id:
          type: string
        portfolio_id:
          type: string
        instrument_id:
          type: string
        quantity:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.
        price:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.
        event_time:
          type: string
          format: date-time
        ingest_time:
          type: string
          format: date-time

    AuditEntry:
      type: object
      description: See docs/domain-model.md#auditentry and ADR-0008.
      required: [entry_id, entry_type, payload, prev_hash, entry_hash, event_time, ingest_time]
      properties:
        entry_id:
          type: string
        entry_type:
          type: string
        payload:
          type: string
          description: Canonical JSON serialization of the audited event.
        prev_hash:
          type: string
          description: Hex-encoded SHA-256 of the previous row's canonical form. Empty string for the first row only.
        entry_hash:
          type: string
          description: Hex-encoded SHA-256 of this row's own canonical form.
        event_time:
          type: string
          format: date-time
        ingest_time:
          type: string
          format: date-time
