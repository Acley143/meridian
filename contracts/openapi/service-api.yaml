openapi: 3.0.3
info:
  title: Meridian Core Service API
  version: "0.1.0"
  description: >
    REST + Server-Sent Events surface exposed by services/core-service
    (ADR-0009). Request/response operations are plain REST; the live risk
    stream is SSE. Types below are a mechanical translation of
    docs/domain-model.md.
servers:
  - url: http://localhost:8080

paths:
  /portfolios/{portfolioId}:
    get:
      summary: Fetch a portfolio's metadata.
      operationId: getPortfolio
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: No portfolio with that id.

  /portfolios/{portfolioId}/positions:
    get:
      summary: Fetch the current positions for a portfolio.
      operationId: listPositions
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /portfolios/{portfolioId}/risk-snapshots/latest:
    get:
      summary: Fetch the most recent risk snapshot for a portfolio, under the latest pricer_version.
      operationId: getLatestRiskSnapshot
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"
        "404":
          description: No snapshot exists yet for that portfolio.

  /portfolios/{portfolioId}/risk-stream:
    get:
      summary: Server-Sent Events stream of RiskSnapshot updates for a portfolio.
      description: >
        Resume semantics per ADR-0012. Each event's `id:` field is
        `{portfolio_id}:{as_of_micros}:{pricer_version}` — the ADR-0007
        identity tuple. On reconnect the browser's EventSource automatically
        sends `Last-Event-ID` with the id of the last event it received; the
        service parses it and replays persisted snapshots for this portfolio
        with a later `as_of` than the one in the header. Replay is bounded at
        500 snapshots or 15 minutes, whichever is smaller — beyond that bound
        the service emits a `resync` event instead of replaying, and the
        client must refetch full state via `GET /portfolios/{id}/positions`
        and `GET /portfolios/{id}/risk-snapshots/latest`.
      operationId: streamRisk
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            Sent automatically by EventSource on reconnect. Format
            `{portfolio_id}:{as_of_micros}:{pricer_version}`, per ADR-0012.
          schema:
            type: string
      responses:
        "200":
          description: >
            text/event-stream of two event types. The default (unnamed)
            event carries a RiskSnapshot JSON payload per `data:` line, with
            an `id:` line per ADR-0012. An `event: resync` carries no
            RiskSnapshot payload and signals the client to refetch full
            state via REST because the requested replay exceeded the bound
            in ADR-0012.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"

components:
  schemas:
    Portfolio:
      type: object
      description: See docs/domain-model.md#portfolio.
      required: [portfolio_id, name, base_currency, owner]
      properties:
        portfolio_id:
          type: string
        name:
          type: string
        base_currency:
          type: string
          description: ISO 4217 currency code.
        owner:
          type: string

    Position:
      type: object
      description: See docs/domain-model.md#position.
      required: [portfolio_id, instrument_id, quantity, average_cost, as_of_event_time]
      properties:
        portfolio_id:
          type: string
        instrument_id:
          type: string
        quantity:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013. Signed — positive is long.
        average_cost:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.
        as_of_event_time:
          type: string
          format: date-time
          description: UTC, microsecond precision.

    RiskSnapshot:
      type: object
      description: See docs/domain-model.md#risksnapshot and ADR-0007.
      required: [portfolio_id, as_of_event_time, pricer_version, portfolio_value, var_95, greeks, ingest_time]
      properties:
        portfolio_id:
          type: string
        as_of_event_time:
          type: string
          format: date-time
        pricer_version:
          type: string
        portfolio_value:
          type: string
          description: Decimal (precision 38, scale 8) encoded as a string, per ADR-0004/ADR-0013.
        var_95:
          type: number
          format: double
        greeks:
          type: object
          additionalProperties:
            type: number
            format: double
        ingest_time:
          type: string
          format: date-time
