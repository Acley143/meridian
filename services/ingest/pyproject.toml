[project]
name = "ingest"
version = "0.1.0"
description = "Simulated tick feed producer (ADR-0005). Language choice per services/ingest/PLAN.md open question; Python default until decided otherwise."
requires-python = ">=3.12"
dependencies = [
    "quant-io",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*"]
