name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  no-attribution-trailer:
    name: Verify no Co-Authored-By trailer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check_no_attribution.py
        run: python3 tools/schema-lint/check_no_attribution.py

  contracts:
    name: Contracts (Avro + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install openapi-spec-validator
      - name: Avro schemas parse, decimal fields declare precision+scale (ADR-0013)
        run: python3 tools/schema-lint/check_avro.py contracts/avro
      - name: service-api.yaml validates against the OpenAPI 3 schema
        run: python3 tools/schema-lint/check_openapi.py contracts/openapi/service-api.yaml

  docs:
    name: Docs (ADR numbering, markdown links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ADR filenames contiguously numbered, no gaps or duplicates
        run: python3 tools/schema-lint/check_adr_numbering.py docs/adr
      - name: Relative markdown links under docs/ resolve
        run: python3 tools/schema-lint/check_markdown_links.py docs

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff mypy pytest import-linter
      - name: ruff
        run: |
          if find libs services -name '*.py' ! -name '__init__.py' | grep -q .; then
            ruff check libs services --exclude apps/dashboard
          else
            echo "SKIP: no non-trivial Python source yet (skeleton stage, see PLAN.md files)"
          fi
      - name: mypy --strict (libs only)
        run: |
          if find libs -name '*.py' ! -name '__init__.py' | grep -q .; then
            mypy --strict libs
          else
            echo "SKIP: no non-trivial Python source under libs/ yet (skeleton stage, see PLAN.md files)"
          fi
      - name: pytest
        run: |
          if find libs services -path '*/tests/*' -name 'test_*.py' | grep -q .; then
            pytest libs services --ignore=services/core-service -q
          else
            echo "SKIP: no tests exist yet (skeleton stage, see docs/test-strategy.md and PLAN.md files)"
          fi

  import-linter:
    name: quant-core purity (ADR-0010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import-linter
        run: pip install import-linter
      - name: lint-imports
        run: lint-imports --config libs/quant-core/.importlinter
        env:
          PYTHONPATH: libs/quant-core
      - name: Enforcement mechanism sanity check (fixture must FAIL import-linter)
        run: |
          cd libs/quant-core
          if PYTHONPATH=tests/fixtures lint-imports --config tests/fixtures/purity_check.cfg; then
            echo "ERROR: tests/fixtures/purity_violation passed import-linter." >&2
            echo "The ADR-0010 enforcement mechanism is broken: a module that" >&2
            echo "imports kafka and requests must never pass this check." >&2
            exit 1
          else
            echo "OK: fixture correctly failed import-linter; enforcement verified."
          fi

  quant-core-boundary:
    name: quant-core Decimal/float boundary (ADR-0013)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Only quant_core/numeric.py may call float()/Decimal() on boundary values
        run: python3 tools/schema-lint/check_quant_core_boundary.py libs/quant-core/quant_core

  java:
    name: Java (mvn verify, spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -pl services/core-service -am verify
      - name: spotless:check
        run: mvn -pl services/core-service com.diffplug.spotless:spotless-maven-plugin:check

  contracts-tests:
    name: Contract tests (round-trip + cross-language decimal fidelity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python bindings + test deps
        run: |
          pip install "avro>=1.11" pytest
          pip install -e contracts/generated/python
      - name: Java round-trip tests (contracts-generated-java)
        run: mvn -q -pl contracts/generated/java test
      - name: Python round-trip + cross-language decimal fidelity tests
        run: |
          cd contracts/tests/python
          pytest -q test_round_trip.py test_cross_language_decimal.py

  typescript:
    name: TypeScript (tsc, eslint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check for lockfile / source
        id: probe
        run: |
          if [ -f package-lock.json ] && [ -d src ] && find src -name '*.ts*' | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm ci / tsc / eslint / vitest
        if: steps.probe.outputs.ready == 'true'
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .
          npx vitest run
      - name: skip
        if: steps.probe.outputs.ready != 'true'
        run: |
          echo "SKIP: no dashboard source/lockfile yet (skeleton stage, see apps/dashboard/PLAN.md)"

  gen-check:
    name: Codegen drift check (make gen, ADR-0015)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Regenerate into a temp directory and diff against what's committed
        run: |
          python3 tools/codegen/generate.py contracts/ --python-out /tmp/gen-python --java-out /tmp/gen-java
          diff -r contracts/generated/python/meridian_contracts /tmp/gen-python
          diff -r contracts/generated/java/src/main/java /tmp/gen-java
          echo "OK: committed bindings match a fresh regeneration."

  schema-registry-compatibility:
    name: Schema registry BACKWARD compatibility (ADR-0002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install avro + pytest
        run: pip install "avro>=1.11" pytest
      - name: Schema evolution test (approximates the registry's BACKWARD check via Avro's own schema resolution; no live registry deployed in CI -- see contracts/tests/python/backward_compat.py)
        run: |
          cd contracts/tests/python
          pytest -q test_schema_evolution.py
