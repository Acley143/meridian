[project]
name = "pricer"
version = "0.1.0"
description = "Consumes ticks and portfolio state, produces RiskSnapshots (ADR-0003, ADR-0007)."
requires-python = ">=3.12"
dependencies = [
    "quant-core",
    "quant-io",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricer*"]
