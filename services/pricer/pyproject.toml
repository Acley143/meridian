[project]
name = "pricer"
version = "0.1.0"
description = "Consumes ticks and portfolio state, produces RiskSnapshots (ADR-0003, ADR-0007)."
requires-python = ">=3.12"
dependencies = [
    "quant-core",
    "quant-io",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "testcontainers>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricer*"]
