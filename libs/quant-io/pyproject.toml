[project]
name = "quant-io"
version = "0.1.0"
description = "Kafka/schema-registry I/O adapters for Meridian's Python services."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.4",
    "fastavro>=1.9",
    "quant-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant_io*"]
